name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno fmt --check
      - run: deno lint
      - run: deno check main.ts src/mcp/main.ts
      - run: deno task test
